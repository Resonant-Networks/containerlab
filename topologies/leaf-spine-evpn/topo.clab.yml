name: demo-clos

mgmt:
  network: clab-demo
  ipv4-subnet: 172.30.20.0/24

topology:
  kinds:
    nokia_srlinux:
      image: ghcr.io/nokia/srlinux
    linux:
      image: ghcr.io/hellt/network-multitool
  nodes:
    leaf1:
      kind: nokia_srlinux
      mgmt-ipv4: 172.30.20.11
    leaf2:
      kind: nokia_srlinux
      mgmt-ipv4: 172.30.20.12
    spine1:
      kind: nokia_srlinux
      mgmt-ipv4: 172.30.20.10
    client1:
      kind: linux
      mgmt-ipv4: 172.30.20.21
    client2:
      kind: linux
      mgmt-ipv4: 172.30.20.22

  links:
    - endpoints: [ "leaf1:e1-1", "spine1:e1-1" ]
    - endpoints: [ "leaf2:e1-1", "spine1:e1-2" ]
    - endpoints: [ "client1:eth1", "leaf1:e1-2" ]
    - endpoints: [ "client2:eth1", "leaf2:e1-2" ]
