# Hostname
set / system name host-name campus-access2

# Loopback
set / interface lo0 subinterface 0 admin-state enable
set / interface lo0 subinterface 0 ipv4 admin-state enable
set / interface lo0 subinterface 0 ipv4 address 10.255.0.12/32

# e1-1: to core1
set / interface ethernet-1/1 admin-state enable
set / interface ethernet-1/1 description "to-campus-core1"
set / interface ethernet-1/1 subinterface 0 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 address 10.0.3.1/31

# e1-2: to core2
set / interface ethernet-1/2 admin-state enable
set / interface ethernet-1/2 description "to-campus-core2"
set / interface ethernet-1/2 subinterface 0 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv4 address 10.0.4.1/31

# e1-3: to pc-sales
set / interface ethernet-1/3 admin-state enable
set / interface ethernet-1/3 description "to-pc-sales"
set / interface ethernet-1/3 subinterface 0 admin-state enable
set / interface ethernet-1/3 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/3 subinterface 0 ipv4 address 10.10.20.1/24

# Attach to default network-instance
set / network-instance default type default
set / network-instance default interface lo0.0
set / network-instance default interface ethernet-1/1.0
set / network-instance default interface ethernet-1/2.0
set / network-instance default interface ethernet-1/3.0

# OSPF routing
set / network-instance default protocols ospf instance default admin-state enable
set / network-instance default protocols ospf instance default version ospf-v2
set / network-instance default protocols ospf instance default router-id 10.255.0.12
set / network-instance default protocols ospf instance default area 0.0.0.0 interface lo0.0 admin-state enable
set / network-instance default protocols ospf instance default area 0.0.0.0 interface lo0.0 passive true
set / network-instance default protocols ospf instance default area 0.0.0.0 interface ethernet-1/1.0 admin-state enable
set / network-instance default protocols ospf instance default area 0.0.0.0 interface ethernet-1/1.0 interface-type point-to-point
set / network-instance default protocols ospf instance default area 0.0.0.0 interface ethernet-1/2.0 admin-state enable
set / network-instance default protocols ospf instance default area 0.0.0.0 interface ethernet-1/2.0 interface-type point-to-point
set / network-instance default protocols ospf instance default area 0.0.0.0 interface ethernet-1/3.0 admin-state enable
set / network-instance default protocols ospf instance default area 0.0.0.0 interface ethernet-1/3.0 passive true

